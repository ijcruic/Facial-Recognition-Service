experiment_name: facenet-supervised-train-nni

trial_command: python3 supervised_train_representation_model.py
trial_code_directory: .

trial_concurrency: 2
max_trial_number: 50

search_space:
  # optimizer hyperparameters
  learning_rate:
    _type: loguniform
    _value: [0.0001, 0.1]
  batch_size:
    _type: choice
    _value: [128, 256, 512, 1024]
  weight_decay:
    _type: loguniform
    _value: [0.000001, 0.001]

  # Sub-Center ArcFace loss hyperparameters
  margin:
    _type: uniform
    _value: [20.0, 40.0]
  scale:
    _type: loguniform
    _value: [32, 256]

tuner:
  name: TPE
  class_args:
    optimize_mode: maximize

training_service:
  platform: local